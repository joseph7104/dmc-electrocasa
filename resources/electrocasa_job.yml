resources:
  jobs:
    electrocasa_etl_job:
      name: "electrocasa_etl_${bundle.target}"

      tasks:
        # Tarea 1: Ejecutar notebook de infraestructura (esquemas + volumes)
        - task_key: setup_inicial
          notebook_task:
            notebook_path: ../notebooks/00_setup.ipynb
            base_parameters:
              catalog: ${var.catalog}

        # Tarea 2: Ejecutar el pipeline Lakeflow (Bronze -> Silver -> Gold)
        - task_key: ejecutar_pipeline
          depends_on:
            - task_key: setup_inicial
          pipeline_task:
            pipeline_id: ${resources.pipelines.electrocasa_pipeline.id}
        
        # Tarea 3: Aplicar permisos GRANT / REVOKE en Unity Catalog
        - task_key: aplicar_gobierno
          depends_on:
            - task_key: ejecutar_pipeline
          notebook_task:
            notebook_path: ../notebooks/01_gobierno.ipynb
            base_parameters:
              catalog: ${var.catalog}

        # Tarea 4: Validación (conteos Silver/Gold, rechazados; falla si Gold está vacío)
        - task_key: validacion
          depends_on:
            - task_key: aplicar_gobierno
          notebook_task:
            notebook_path: ../notebooks/02_validacion.ipynb
            base_parameters:
              catalog: ${var.catalog}

      # Programación opcional (puedes dejarlo comentado o en PAUSED si solo lo correrás manual)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Lima"
        pause_status: PAUSED