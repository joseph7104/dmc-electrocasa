resources:
  jobs:
    electrocasa_etl_job:
      name: "electrocasa_etl_${bundle.target}"

      tasks:
        # Tarea 1: Ejecutar notebook de infraestructura (esquemas + volumes)
        - task_key: setup_inicial
          notebook_task:
            notebook_path: ../notebooks/00_setup.ipynb
            base_parameters:
              catalog: ${var.catalog}

        # Tarea 2 (NUEVA): Ingesta de sucursales en Bronze con COPY INTO
        - task_key: ingesta_sucursales_bronze
          depends_on:
            - task_key: setup_inicial
          notebook_task:
            notebook_path: ../notebooks/Ingesta_Sucursal.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema_bronze: ${var.schema_bronze}
              landing_path: ${var.landing_path}

        # Tarea 3: Ejecutar el pipeline Lakeflow (Bronze -> Silver -> Gold)
        - task_key: ejecutar_pipeline
          depends_on:
            - task_key: ingesta_sucursales_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.electrocasa_pipeline.id}
        
        # Tarea 4: Aplicar permisos GRANT / REVOKE en Unity Catalog
        - task_key: aplicar_gobierno
          depends_on:
            - task_key: ejecutar_pipeline
          notebook_task:
            notebook_path: ../notebooks/01_gobierno.ipynb
            base_parameters:
              catalog: ${var.catalog}

        # Tarea 5: Validación (conteos Silver/Gold, rechazados; falla si Gold está vacío)
        - task_key: validacion
          depends_on:
            - task_key: aplicar_gobierno
          notebook_task:
            notebook_path: ../notebooks/02_validacion.ipynb
            base_parameters:
              catalog: ${var.catalog}

      # Programación opcional (puedes dejarlo comentado o en PAUSED si solo lo correrás manual)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Lima"
        pause_status: PAUSED